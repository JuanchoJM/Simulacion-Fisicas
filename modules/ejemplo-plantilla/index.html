<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva simulación</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-6 font-sans">
<main class="max-w-4xl mx-auto">
<a href="../../index.html" class="text-cyan-300 text-sm">← Volver al laboratorio</a>
<h1 class="text-3xl font-bold text-cyan-400 mt-5">Mi nueva simulación</h1>
<p class="text-slate-300 mt-2">Aquí puedes colocar la explicación, controles y resultados.</p>
<section class="mt-6 rounded-xl border border-slate-700 p-5">
<label for="amplitude" class="block mb-2">Amplitud: <span id="ampValue">1.0</span></label>
<input id="amplitude" type="range" min="0.1" max="5" step="0.1" value="1" class="w-full">
<p class="mt-4">Valor calculado: <strong id="result">1.0</strong></p>
</section>
</main>
<script>
const slider=document.getElementById('amplitude');
function update(){
  const A=Number(slider.value);
  document.getElementById('ampValue').textContent=A.toFixed(1);
  document.getElementById('result').textContent=(A*A).toFixed(2);
}
slider.addEventListener('input',update);
update();
</script>
</body></html>
