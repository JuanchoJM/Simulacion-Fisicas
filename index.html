<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboratorio de Física | Juan Jimenez</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
html,body{min-height:100%;} #moduleFrame{width:100%;height:calc(100vh - 170px);min-height:700px;border:0;background:#020617}
.nav-active{background:#0891b2!important;color:white!important;border-color:#06b6d4!important}
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-6 font-sans">
<header class="max-w-7xl mx-auto text-center border-b border-slate-800 pb-4">
<h1 class="text-3xl md:text-4xl font-extrabold text-cyan-400">Laboratorio de Física</h1>
<p class="text-sm text-slate-400 mt-1">Simulaciones interactivas · By Juan Jimenez</p>
<div id="moduleNav" class="flex flex-wrap items-center justify-center gap-2 mt-4"></div>
<div class="flex flex-wrap items-center justify-center gap-2 mt-3">
<button id="musicBtn" class="rounded-xl border border-violet-700 bg-violet-950/50 px-4 py-2 text-sm font-semibold text-violet-200" onclick="toggleMusic()">♫ Activar música</button>
<label class="text-xs text-slate-400 flex items-center gap-2">Volumen
<input id="musicVolume" type="range" min="0" max="100" value="45" class="accent-violet-400 w-24" oninput="setMusicVolume(this.value)">
</label>
</div>
<p class="mt-2 text-xs text-slate-500">La música ambiental comienza únicamente cuando la activas y puedes silenciarla en cualquier momento.</p>
</header>
<main class="max-w-7xl mx-auto mt-4 overflow-hidden rounded-2xl border border-slate-800">
<iframe id="moduleFrame" title="Simulación seleccionada" src="modules/pendulo/index.html"></iframe>
</main>
<footer class="max-w-7xl mx-auto text-center mt-4 text-xs text-slate-600">Puedes añadir módulos independientes sin modificar el código de las simulaciones existentes.</footer>
<script src="modules.js"></script>
<script>
let currentModule = null;
function renderModuleNav(){
  const nav=document.getElementById('moduleNav');
  nav.innerHTML='';
  LAB_MODULES.forEach((mod,index)=>{
    const btn=document.createElement('button');
    btn.textContent=mod.name;
    btn.className='rounded-xl border border-slate-700 bg-slate-900 px-4 py-2 text-sm font-semibold text-slate-300 hover:bg-slate-800';
    btn.dataset.module=mod.id;
    btn.onclick=()=>loadModule(mod.id);
    nav.appendChild(btn);
  });
}
function loadModule(id){
  const mod=LAB_MODULES.find(m=>m.id===id);
  if(!mod)return;
  currentModule=id;
  document.getElementById('moduleFrame').src=mod.entry;
  document.querySelectorAll('#moduleNav button').forEach(btn=>{
    const active=btn.dataset.module===id;
    btn.classList.toggle('nav-active',active);
    btn.classList.toggle('text-slate-300',!active);
  });
}
renderModuleNav();
loadModule(LAB_MODULES[0].id);

// Audio ambiental original, sintetizado localmente. Requiere activación explícita.
let audioCtx=null, masterGain=null, oscillators=[], audioOn=false;
async function toggleMusic(){
  const btn=document.getElementById('musicBtn');
  if(audioOn){
    if(masterGain && audioCtx){
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setTargetAtTime(0,audioCtx.currentTime,0.18);
    }
    audioOn=false;
    btn.textContent='♫ Activar música';
    setTimeout(()=>{
      if(!audioOn && audioCtx){
        oscillators.forEach(o=>{try{o.stop()}catch(e){}});
        oscillators=[];
        audioCtx.close();
        audioCtx=null;
        masterGain=null;
      }
    },900);
    return;
  }
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){btn.textContent='Audio no compatible';return;}
  try{
    if(!audioCtx || audioCtx.state==='closed'){
      audioCtx=new AC();
      masterGain=audioCtx.createGain();
      masterGain.gain.value=0;
      masterGain.connect(audioCtx.destination);
      const notes=[110,164.81,220,261.63,329.63];
      notes.forEach((freq,i)=>{
        const osc=audioCtx.createOscillator();
        const gain=audioCtx.createGain();
        const filter=audioCtx.createBiquadFilter();
        osc.type='sine';
        osc.frequency.value=freq;
        gain.gain.value=[0.22,0.13,0.10,0.08,0.045][i];
        filter.type='lowpass';
        filter.frequency.value=900;
        osc.connect(filter); filter.connect(gain); gain.connect(masterGain);
        osc.start(); oscillators.push(osc);
      });
      // Modulación lenta y suave para que el fondo no sea un tono totalmente fijo.
      const lfo=audioCtx.createOscillator();
      const lfoGain=audioCtx.createGain();
      lfo.frequency.value=0.12;
      lfoGain.gain.value=0.018;
      lfo.connect(lfoGain); lfoGain.connect(masterGain.gain);
      lfo.start(); oscillators.push(lfo);
    }
    await audioCtx.resume();
    const volume=Number(document.getElementById('musicVolume').value)/100;
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setTargetAtTime(0.22*volume,audioCtx.currentTime,0.45);
    audioOn=true;
    btn.textContent='♫ Silenciar música';
  }catch(err){
    btn.textContent='No se pudo iniciar el audio';
    console.error('Audio:',err);
  }
}
function setMusicVolume(value){
  if(audioOn && masterGain && audioCtx){
    masterGain.gain.setTargetAtTime(0.22*(Number(value)/100),audioCtx.currentTime,0.08);
  }
}
</script>
</body></html>
